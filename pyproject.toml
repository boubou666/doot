[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
# Le nom de distribution historique reste `spooky-doot`, meme si le projet
# n'est plus publie sur PyPI. Le module et la commande restent `doot`.
name = "spooky-doot"
version = "1.35.0"
description = "Un squelette trompettiste qui surgit au hasard sur ton ecran, du 1er septembre au 31 octobre."
readme = "README.md"
# La CI eprouve de nouveau 3.8 : uv telecharge l'interpreteur, la ou les images
# GitHub ne le fournissent plus. La raison qui avait fait descendre cette borne
# a >=3.9 a donc disparu, et on peut l'annoncer sans mentir.
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["doot", "skeleton", "halloween", "spooky", "prank", "desktop"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: French",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Multimedia :: Graphics",
]
dependencies = ["desktop-overlay @ https://github.com/boubou666/desktop-overlay/releases/download/v0.3.0/desktop_overlay-0.3.0-py3-none-any.whl#sha256=d9cef4b14b7a7a6dd5cca83a5bb7de1357cea25d9296dc4523d478b3112ddca6",
                "cryptography>=42"]

[project.optional-dependencies]
tray = ["pystray>=0.19.5", "Pillow>=10"]

[project.scripts]
doot = "doot.cli:main"

[project.gui-scripts]
doot-gui = "doot.gui:main"

[project.urls]
Homepage = "https://github.com/boubou666/doot"
Repository = "https://github.com/boubou666/doot"
Changelog = "https://github.com/boubou666/doot/blob/main/CHANGELOG.md"
Issues = "https://github.com/boubou666/doot/issues"

[tool.setuptools]
packages = ["doot"]

[tool.setuptools.package-data]
doot = ["assets/*", "assets/melodies/*", "assets/success/*"]
