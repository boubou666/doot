[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
# Le nom court « doot » est deja pris sur PyPI par un lanceur de taches. Seul
# le nom de distribution change : le module reste `doot`, la commande aussi.
name = "spooky-doot"
version = "1.7.2"
description = "Un squelette trompettiste qui surgit au hasard sur ton ecran, du 1er septembre au 31 octobre."
readme = "README.md"
# La CI eprouve de nouveau 3.8 : uv telecharge l'interpreteur, la ou les images
# GitHub ne le fournissent plus. La raison qui avait fait descendre cette borne
# a >=3.9 a donc disparu, et on peut l'annoncer sans mentir.
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["doot", "skeleton", "halloween", "spooky", "prank", "desktop"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: French",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Multimedia :: Graphics",
]
dependencies = ["desktop-overlay>=0.2.0,<0.3"]

[project.scripts]
doot = "doot.cli:main"

[project.urls]
Homepage = "https://github.com/boubou666/doot"
Repository = "https://github.com/boubou666/doot"
Changelog = "https://github.com/boubou666/doot/blob/main/CHANGELOG.md"
Issues = "https://github.com/boubou666/doot/issues"

[tool.setuptools]
packages = ["doot"]

[tool.setuptools.package-data]
doot = ["assets/*"]
